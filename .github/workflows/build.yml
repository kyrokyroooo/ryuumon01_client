name: Build Mod Jar

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Unzip source if present
        run: |
          if [ -f ryuumon01-client-source.zip ]; then
            unzip -o ryuumon01-client-source.zip -d extracted
            cp -r extracted/ryuumon01-client/. .
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --stacktrace

      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: ryuumon01-client-jar
          path: build/libs/*.jar
