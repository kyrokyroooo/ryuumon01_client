name: Build Ryuumon01 Client

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auto-unzip if source is a zip file
        run: |
          ZIPFILE=$(find . -maxdepth 2 -iname "*.zip" | head -n 1)
          if [ -n "$ZIPFILE" ]; then
            echo "Found zip: $ZIPFILE, extracting..."
            unzip -o "$ZIPFILE" -d extracted
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build mod jar
        run: |
          PROJECT_DIR=$(find . -iname "build.gradle" -not -path "*/build/*" | head -n 1 | xargs dirname)
          echo "Building in: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle build --no-daemon

      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: ryuumon01-client-jar
          path: '**/build/libs/*.jar'
